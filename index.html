<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRD Critic</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 16px; color: #222; background: #fafafa; }
  h1 { margin-bottom: 4px; }
  .sub { color: #666; margin-top: 0; }
  textarea { width: 100%; height: 220px; padding: 10px; font-size: 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 18px; font-size: 15px; border: none; border-radius: 6px; cursor: pointer; margin-right: 8px; }
  #reviewBtn { background: #2563eb; color: white; }
  #exampleBtn { background: #e5e7eb; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .note { font-size: 13px; color: #666; margin-top: 12px; }
  #error { color: #b91c1c; margin-top: 12px; }
  #score { font-size: 42px; font-weight: bold; margin: 24px 0 4px; }
  .dim { margin-top: 20px; }
  .dim h3 { margin-bottom: 6px; text-transform: capitalize; }
  .finding { background: white; border: 1px solid #ddd; border-left: 6px solid #999; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .finding.high { border-left-color: #dc2626; }
  .finding.medium { border-left-color: #f59e0b; }
  .finding.low { border-left-color: #eab308; }
  .tag { font-size: 12px; font-weight: bold; text-transform: uppercase; }
  .quote { font-style: italic; color: #444; margin: 6px 0; }
  .fix { background: #ecfdf5; padding: 6px 8px; border-radius: 4px; margin-top: 6px; }
  .copy { font-size: 12px; padding: 3px 8px; margin: 6px 0 0 0; background: #e5e7eb; }
</style>
</head>
<body>

<h1>PRD Critic</h1>
<p class="sub">Paste a product requirements doc and get a review like one from a skeptical senior PM.</p>

<textarea id="prd" placeholder="Paste your PRD here..."></textarea>
<div style="margin-top:10px">
  <button id="reviewBtn">Review</button>
  <button id="exampleBtn">Try an example</button>
</div>

<p class="note">AI review. Use it as a second opinion, not a verdict. Your PRD is not stored.</p>
<div id="error"></div>
<div id="mode" class="note"></div>
<div id="score"></div>
<div id="results"></div>

<script>
const prdBox = document.getElementById("prd");
const reviewBtn = document.getElementById("reviewBtn");
const exampleBtn = document.getElementById("exampleBtn");
const errorBox = document.getElementById("error");
const resultsBox = document.getElementById("results");
const scoreBox = document.getElementById("score");
const modeBox = document.getElementById("mode");

exampleBtn.onclick = async () => {
  const res = await fetch("/example");
  const data = await res.json();
  prdBox.value = data.text;
};

reviewBtn.onclick = async () => {
  errorBox.textContent = "";
  resultsBox.innerHTML = "";
  scoreBox.textContent = "";
  modeBox.textContent = "";
  reviewBtn.disabled = true;
  reviewBtn.textContent = "Reviewing...";

  try {
    const res = await fetch("/review", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: prdBox.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Something went wrong.");
    showResults(data);
  } catch (e) {
    errorBox.textContent = e.message;
  }

  reviewBtn.disabled = false;
  reviewBtn.textContent = "Review";
};

function showResults(data) {
  const color = data.score < 40 ? "#dc2626" : data.score < 70 ? "#f59e0b" : "#16a34a";
  scoreBox.textContent = data.score + " / 100";
  scoreBox.style.color = color;
  modeBox.textContent = data.mode === "mock"
    ? "Running in MOCK mode: findings are pre-written demo data."
    : "Reviewed by Claude.";

  data.results.forEach(dim => {
    const section = document.createElement("div");
    section.className = "dim";

    const title = document.createElement("h3");
    title.textContent = dim.dimension.replace("_", " ") + " (" + dim.score + "/10)";
    section.appendChild(title);

    if (dim.findings.length === 0) {
      const ok = document.createElement("div");
      ok.textContent = "No issues found.";
      section.appendChild(ok);
    }

    dim.findings.forEach(f => {
      const card = document.createElement("div");
      card.className = "finding " + f.severity;

      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = f.severity;

      const quote = document.createElement("div");
      quote.className = "quote";
      quote.textContent = f.quote === "(missing)" ? "(something is missing from the PRD)" : "\u201C" + f.quote + "\u201D";

      const issue = document.createElement("div");
      issue.textContent = f.issue;

      const fix = document.createElement("div");
      fix.className = "fix";
      fix.textContent = "Suggested fix: " + f.suggested_fix;

      const copy = document.createElement("button");
      copy.className = "copy";
      copy.textContent = "Copy fix";
      copy.onclick = () => {
        navigator.clipboard.writeText(f.suggested_fix);
        copy.textContent = "Copied!";
      };

      card.append(tag, quote, issue, fix, copy);
      section.appendChild(card);
    });

    resultsBox.appendChild(section);
  });
}
</script>
</body>
</html>
